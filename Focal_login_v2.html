<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focal | Log in</title>

  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --focal-bg: #f5f5f5;
      --focal-input-bg: #efe7da;
      --focal-ink: #3d3d3d;
      --focal-muted: #6f6f6a;
      --focal-border: #efe7da;
      --focal-green: #76a62a;
      --focal-pink: #ed6a5a;
      --bs-body-font-family: "Inter", system-ui, sans-serif;
      --bs-body-bg: var(--focal-bg);
      --bs-body-color: var(--focal-ink);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--focal-bg);
    }

    .brand-logo {
      display: block;
      width: 150px;
      max-width: 45vw;
      height: auto;
      margin: 0 auto;
    }

    .headline {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      font-size: clamp(2.3rem, 5vw, 2.9rem);
      line-height: 1.1;
    }

    .subtext { color: var(--focal-muted); font-size: 0.95rem; line-height: 1.6; }

    .login-card { max-width: 400px; width: 100%; }

    .form-label { font-size: 0.85rem; font-weight: 500; margin-bottom: 0.5rem; }

    .form-control {
      background: var(--focal-input-bg);
      border: 1px solid var(--focal-border);
      border-radius: 2px;
      height: 50px;
      font-size: 0.9rem;
      padding-inline: 1rem;
    }
    .form-control::placeholder { color: #85857f; }
    .form-control:focus {
      background: var(--focal-input-bg);
      border-color: var(--focal-green);
      box-shadow: 0 0 0 0.2rem rgba(118, 166, 42, 0.2);
    }

    .password-wrap { position: relative; }
    .password-wrap .form-control { padding-right: 3rem; }
    .toggle-pw {
      position: absolute;
      top: 50%;
      right: 0.9rem;
      transform: translateY(-50%);
      border: 0;
      background: none;
      color: var(--focal-muted);
      padding: 0;
      line-height: 1;
    }

    .forgot { font-size: 0.8rem; color: var(--focal-ink); text-decoration: underline; }
    .forgot:hover { color: var(--focal-pink); }

    .btn-focal {
      background: var(--focal-green);
      border: 1px solid var(--focal-green);
      color: #fff;
      height: 50px;
      border-radius: 2px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .btn-focal:hover, .btn-focal:focus {
      background: var(--focal-pink);
      border-color: var(--focal-pink);
      color: #fff;
    }

    .btn-google {
      background: transparent;
      border: 1px solid var(--focal-border);
      color: var(--focal-ink);
      height: 50px;
      border-radius: 2px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .btn-google:hover { background: var(--focal-input-bg); border-color: #bdbbb3; color: var(--focal-ink); }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--focal-muted);
      font-size: 0.75rem;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--focal-border);
    }

    .signup-line { font-size: 0.85rem; color: var(--focal-muted); }
    .signup-link { color: var(--focal-green); text-decoration: underline; }
    .signup-link:hover { color: var(--focal-pink); }

    footer {
      border-top: 1px solid var(--focal-border);
      font-size: 0.75rem;
      color: var(--focal-muted);
    }
    footer a { color: var(--focal-muted); text-decoration: none; margin-left: 1.5rem; }
    footer a:hover { color: var(--focal-ink); }
  </style>
</head>
<body>

  <main class="flex-grow-1">
    <div class="container py-4">

      <!-- Logo -->
      <div class="text-center mb-5 pt-1">
        <a href="#" aria-label="Focal home"><img src="focal-logo.png" class="brand-logo" alt="Focal logo" width="1448" height="1086" /></a>
      </div>

      <!-- Login -->
      <div class="login-card mx-auto mt-4 mt-md-5">
        <h1 class="headline mb-3">Welcome back.</h1>
        <p class="subtext mb-4">
          Log in to pick up where you left off with the art you love.
        </p>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="Enter your username" autocomplete="username" maxlength="20" required />
            <div class="invalid-feedback">Please enter a valid username (letters, numbers, and underscores only).</div>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-baseline">
              <label for="password" class="form-label">Password</label>
              <a href="#" class="forgot">Forgot password?</a>
            </div>
            <div class="password-wrap">
              <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password" required />
              <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback d-block" id="pwError" hidden>Please enter your password.</div>
          </div>

          <button type="submit" class="btn btn-focal w-100 d-flex align-items-center justify-content-center gap-2">
            Log in <i class="bi bi-arrow-right"></i>
          </button>

          <div class="divider my-4"><span>or</span></div>

          <button type="button" class="btn btn-google w-100 d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-google"></i> Continue with Google
          </button>

          <p class="signup-line text-center mt-4 mb-0">
            New to Focal? <a href="signup.html" class="signup-link">Create an account</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <footer class="mt-5">
    <div class="container-fluid px-4 px-md-5 py-4 d-flex justify-content-between align-items-center">
      <span>&copy; 2026 Focal</span>
      <nav>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const pw = document.getElementById("password");
    const toggle = document.getElementById("togglePw");
    const username = document.getElementById("username");
    const pwError = document.getElementById("pwError");

    const USERNAME_RE = /^[A-Za-z0-9_]{3,20}$/;

    // Strip characters that aren't allowed as the user types
    username.addEventListener("input", () => {
      username.value = username.value.replace(/[^A-Za-z0-9_]/g, "");
      username.classList.remove("is-invalid");
    });

    // Show / hide password
    toggle.addEventListener("click", () => {
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      toggle.innerHTML = `<i class="bi bi-eye${show ? "-slash" : ""}"></i>`;
      toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    // Basic validation
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      let ok = true;

      const userValid = USERNAME_RE.test(username.value);
      username.classList.toggle("is-invalid", !userValid);
      if (!userValid) ok = false;

      const pwEmpty = pw.value.length === 0;
      pwError.hidden = !pwEmpty;
      if (pwEmpty) ok = false;

      if (ok) {
        // TODO: send to backend
        console.log("Login attempt:", username.value);
      }
    });
  </script>
</body>
</html>
